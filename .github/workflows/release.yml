name: Release

# Publishes to npm. Never runs automatically on every push — only on an
# explicit version tag (v*) or a manual dispatch, and only if the
# NPM_TOKEN secret is configured. Nothing here runs `npm publish` unless
# a human deliberately triggered it.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package.json version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          # Requires an npm automation token stored as a secret named
          # NPM_TOKEN, scoped to the "npm-release" environment below.
          # Provenance requires the registry and CI to support OIDC (npm
          # registry + GitHub Actions with id-token: write, both present
          # here).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
